services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: entertabcrm
      POSTGRES_PASSWORD: entertabcrm
      POSTGRES_DB: entertabcrm_auth
    ports:
      - "5432:5432"
    volumes:
      - entertabcrm_auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entertabcrm -d entertabcrm_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  entertabcrm_auth_pgdata:
